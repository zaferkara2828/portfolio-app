<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hisse Fiyatı Çekme</title>
</head>
<body>
  <h1>Güncel Hisse Fiyatı</h1>
  <input id="symbol" placeholder="AAPL" value="AAPL" />
  <button id="btn">Fiyat Getir</button>
  <p id="result">Sonuç bekleniyor...</p>

  <script>
    const API_KEY = "BURAYA_API_KEY";
    const result = document.getElementById("result");
    const symbolInput = document.getElementById("symbol");
    const btn = document.getElementById("btn");

    async function getStockPrice(symbol) {
      const url = `https://www.alphavantage.co/query?function=GLOBAL_QUOTE&symbol=${encodeURIComponent(symbol)}&apikey=${API_KEY}`;
      const res = await fetch(url);
      const data = await res.json();

      const quote = data["Global Quote"];
      if (!quote || !quote["05. price"]) {
        throw new Error("Fiyat verisi bulunamadı");
      }

      return {
        symbol: quote["01. symbol"],
        price: quote["05. price"],
        change: quote["09. change"],
        changePercent: quote["10. change percent"]
      };
    }

    btn.addEventListener("click", async () => {
      const symbol = symbolInput.value.trim().toUpperCase();
      if (!symbol) return;

      result.textContent = "Yükleniyor...";

      try {
        const stock = await getStockPrice(symbol);
        result.textContent =
          `${stock.symbol} fiyatı: ${stock.price} | Değişim: ${stock.change} | Yüzde: ${stock.changePercent}`;
      } catch (err) {
        result.textContent = "Hata: " + err.message;
      }
    });
  </script>
</body>
</html>
